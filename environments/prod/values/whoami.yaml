name: whoami-prod

replicaCount: 2

image:
  repository: traefik/whoami
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

service:
  name: whoami-prod
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: whoami-prod.local
  path: /
