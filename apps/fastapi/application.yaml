apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fastapi
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/romain617/devops-platform-iso-prod.git
    targetRevision: main
    path: apps/fastapi/chart

  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
